name: Terraform apply

on:
  workflow_dispatch:    # manual trigger only — never auto-apply
    inputs:
      confirm:
        description: "Type APPLY to confirm VM creation"
        required: true
        default: ""

jobs:
  terraform-apply:
    name: Apply — create VMs
    runs-on: [self-hosted, rhel9, hyperv]
    if: github.event.inputs.confirm == 'APPLY'

    defaults:
      run:
        working-directory: infra/terraform

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Terraform init
        run: terraform init
        env:
          TF_VAR_hyperv_password: ${{ secrets.HYPERV_PASSWORD }}

      - name: Terraform apply
        run: |
          terraform apply -auto-approve \
            -var="hyperv_host=${{ secrets.HYPERV_HOST }}" \
            -var="hyperv_user=${{ secrets.HYPERV_USER }}" \
            -var="hyperv_password=${{ secrets.HYPERV_PASSWORD }}"

      - name: Show outputs
        run: terraform output vm_summary
