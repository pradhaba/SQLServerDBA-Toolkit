---
all:
  vars:
    # WinRM connection defaults for all Windows hosts
    ansible_user: "{{ domain_name }}\\Administrator"
    ansible_password: "{{ windows_admin_password }}"
    ansible_connection: winrm
    ansible_winrm_transport: basic
    ansible_winrm_port: 5985
    ansible_winrm_scheme: http
    ansible_winrm_server_cert_validation: ignore
    ansible_winrm_operation_timeout_sec: 120
    ansible_winrm_read_timeout_sec: 150

# ── Domain controller ────────────────────────────────────────────────────────
domain_controllers:
  hosts:
    DC:
      ansible_host: 192.168.100.10
      # Before domain join, use local admin
      ansible_user: Administrator
      ansible_winrm_transport: basic

# ── SQL Server nodes ─────────────────────────────────────────────────────────
sql_servers:
  hosts:
    server1:
      ansible_host: 192.168.100.11
      sql_role: primary
    server2:
      ansible_host: 192.168.100.12
      sql_role: secondary

sql_primary:
  hosts:
    server1:
      ansible_host: 192.168.100.11

sql_secondary:
  hosts:
    server2:
      ansible_host: 192.168.100.12

# ── Witness node ─────────────────────────────────────────────────────────────
witness:
  hosts:
    witness:
      ansible_host: 192.168.100.13

# ── All Windows VMs (post domain join) ──────────────────────────────────────
windows:
  children:
    domain_controllers:
    sql_servers:
    witness:
